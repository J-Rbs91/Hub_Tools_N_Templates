name: Sécurité

# Analyse de sécurité : CodeQL (JS embarqué dans les pages) + détection de secrets.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Économie de minutes Actions : un nouveau push sur la même réf annule le run en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # CodeQL tourne aussi sur les push vers main. GitHub ne referme une alerte de
    # code scanning que lorsqu'une nouvelle analyse de la branche par défaut ne la
    # contient plus : en sautant les push, un correctif fusionné laissait l'alerte
    # ouverte jusqu'au planning hebdomadaire, soit jusqu'à sept jours d'écart entre
    # l'onglet « Security » et l'état réel du code. Le dépôt est public, les minutes
    # Actions y sont gratuites.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
