<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">HUB</title>
  <desc id="desc">Monogramme typographique H U B d'inspiration néo-brutaliste suisse. H et B sombres, U clair en réserve dans un bloc sombre.</desc>
  <rect width="64" height="64" fill="#FAFBFC"/>
  <!-- H : construction modulaire massive, angles droits -->
  <path fill="#283444" d="M4 13h5v15h8V13h5v38h-5V34H9v17H4Z"/>
  <!-- U : corps inversé, bloc graphique central qui signe le logo -->
  <rect x="22" y="8" width="21" height="48" fill="#283444"/>
  <path fill="#FAFBFC" d="M26.2 14h4.1v25.4c0 4.1.9 5.6 2.2 5.6s2.2-1.5 2.2-5.6V14h4.1v25.1c0 7.3-2 11.5-6.3 11.5s-6.3-4.2-6.3-11.5Z"/>
  <!-- B : contreformes rectangulaires condensées, dessinées pour 16 px -->
  <path fill="#283444" fill-rule="evenodd" d="M44 13h7.3c6 0 8.7 3.1 8.7 8.9v3.2c0 4.2-1.6 6.5-3.6 7.1 2.6.8 3.9 3.6 3.9 7.7v2c0 6.2-2.9 9.1-8.8 9.1H44Zm5.1 5v11.6h2c2.8 0 3.5-1.2 3.5-4.5v-2.4c0-3.2-.9-4.7-3.6-4.7Zm0 16.4V46h2.1c2.9 0 3.7-1.1 3.7-4.7v-2.2c0-3.2-.9-4.7-3.8-4.7Z"/>
</svg>
