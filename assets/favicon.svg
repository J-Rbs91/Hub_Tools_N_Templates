<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 208 1154 738" preserveAspectRatio="none" role="img" aria-labelledby="title desc">
  <title id="title">HUB</title>
  <desc id="desc">Monogramme HUB néo-brutaliste bleu-gris sur fond transparent.</desc>
  <!-- Géométrie fidèle à la version validée. Cadrage carré sans marge verticale, pour occuper presque 16 × 16 px. -->
  <g transform="translate(-50 -15)" fill="#405e70">
    <!-- H : masse orthogonale et traverse compacte. -->
    <path d="M51 324 H179 V537 H282 V324 H396 V873 H282 V655 H179 V873 H51 Z"/>
    <!-- U : contreforme transparente taillée dans le bloc central. -->
    <path fill-rule="evenodd" d="M409 229 H812 V955 H409 Z
      M474 322 H569 V707
      C569 734 589 749 614 749
      C639 749 657 734 657 707
      V322 H752 V719
      C752 806 690 874 611 874
      C530 874 474 809 474 719 Z"/>
    <!-- B : deux ouvertures carrées et encoche extérieure angulaire. -->
    <path fill-rule="evenodd" d="M827 324 H1203 V531 L1142 594 L1203 654 V873 H827 Z
      M957 430 H1065 V537 H957 Z
      M957 656 H1065 V770 H957 Z"/>
  </g>
</svg>
