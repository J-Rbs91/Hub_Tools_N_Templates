    reason: 'Candidat refuse par le Control Plane apres parcours reel dans Chromium.
      Trois defauts, les deux premiers bloquants. 1) Une prescription purement spherique
      est refusee : cylindre laisse vide, l interface renvoie PRESCRIPTION_INVALIDE
      valeur numerique invalide pour cyl. Un champ cylindre vide vaut zero, c est
      l ecriture normale d une correction spherique et le cas le plus frequent en
      lentilles souples ; le noyau la gere, seule la lecture de la saisie est en cause.
