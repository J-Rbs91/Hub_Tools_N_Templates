  acceptance_criteria:
  - une distance vertex nulle laisse la correction inchangée
  - une sphère négative devient moins négative au plan cornéen, une sphère positive
    devient plus positive
  - la compensation aller puis retour redonne la valeur de départ à moins d'un millième
    de dioptrie
  - en sphéro-cylindrique les deux méridiens principaux sont compensés séparément
    et l'axe est reconduit inchangé
  - la distance de surréfraction est un paramètre distinct de la distance vertex du
    moteur A
  - une surréfraction sphéro-cylindrique d'axe différent est combinée par vecteurs
    de puissance et jamais par addition composante à composante
  - rotation nulle, puis rotation observée avec surréfraction nulle, redonnent la
    lentille portée
  - une rotation déclarée instable est signalée dans le résultat sans supprimer la
    valeur calculée
  - la valeur théorique et la valeur cible arrondie coexistent dans le résultat, la
    seconde ne remplace jamais la première
  - un vertex négatif, aberrant ou non numérique produit un problème identifié et
    jamais une valeur
