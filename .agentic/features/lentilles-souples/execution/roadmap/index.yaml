- schema_version: 1
  id: TKT-002
  title: Moteur A (conversion lunettes vers plan cornéen et cible lentille) et moteur
    B (surréfraction sphérique et sphéro-cylindrique, rotation torique avec sens et
    stabilité).
  status: to_execute
  origin:
    type: planned
    parent: LS-02
  objective: Moteur A (conversion lunettes vers plan cornéen et cible lentille) et
    moteur B (surréfraction sphérique et sphéro-cylindrique, rotation torique avec
    sens et stabilité).
  scope:
    include:
    - Moteur A (conversion lunettes vers plan cornéen et cible lentille) et moteur
      B (surréfraction sphérique et sphéro-cylindrique, rotation torique avec sens
      et stabilité).
    exclude: []
  files:
  - outils/lentilles-souples/noyau/moteurs.js
  - tests/lentilles-souples.test.mjs
  produces: []
  consumes: []
  depends_on:
