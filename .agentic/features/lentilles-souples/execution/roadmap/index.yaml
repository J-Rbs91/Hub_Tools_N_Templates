      : un bloc non rempli doit rester silencieux. 3) Le message affiche est un code
      interne suivi d un fragment sans accents nommant un champ interne (cyl, sph)
      : CON-004 impose du francais utilisateur. Les tests du ticket ne couvrent aucun
      de ces cas parce qu ils portent sur le noyau et pas sur la lecture des champs.'
  - from: partial_execution
    to: to_execute
    at: '2026-09-05T12:30:51Z'
    reason: 'REPRISE APRES SECOND REFUS. Les trois defauts du premier refus sont corriges
      et verifies : correction purement spherique acceptee, oeil vide silencieux,
      messages en francais. Ne pas y revenir. UN SEUL POINT RESTE, ET IL EST BLOQUANT
      : le cas axe hors plage du contrat n est pas traite. Un axe saisi a 200 est
      replie en silence sur 20 et le calcul se poursuit, il affiche theorique sph
      -1,95 cyl -0,94 axe 20 sans une reserve. L axe est modulo 180 en mathematiques,
      mais 200 saisi au clavier est une faute de frappe pour 20 ou pour 100, et le
      module existe pour ne pas produire une valeur plausible et fausse sans le dire.
      Attendu : le domaine de saisie est 1..180, 0 etant lu comme 180 ; toute valeur
      hors de ce domaine doit produire un probleme affiche du meme type que AXE_INVALIDE
      et aucun calcul pour cet oeil. normalizeAxis reste l outil des axes calcules
      par les moteurs, pas des axes saisis par l utilisateur. Verifier ensuite par
      un parcours reel, pas seulement par les tests du noyau : les tests actuels ne
      couvrent pas la lecture des champs. NON BLOQUANT, libre appreciation : une sphere
      de -45,00 D est calculee sans reserve, ce cas ne figure pas dans les dix du
      contrat. Les codes internes affiches avant la phrase francaise sont voulus,
      ne pas les retirer.'
