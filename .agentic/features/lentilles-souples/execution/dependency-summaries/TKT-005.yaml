behavior:
- outils/lentilles-souples/index.html charge desormais le noyau reel par <script src>
  (prescription.js, moteurs.js, selection.js, catalogue.js, donnees/catalogue-demo.js
  dans cet ordre) et expose trois blocs operationnels (A id=bloc-a, B id=bloc-b en
  <details>, C id=bloc-c) ; aucune modale/couche Couches n'est ouverte (uniquement
  des <details> natifs), donc TKT-006 (carte hub) et TKT-007 (CI tests) n'ont rien
  a ajuster cote navigation arriere pour ce fichier.
- 'Les 10 cas d''erreur du contrat sont routes vers les codes reels du noyau (PRESCRIPTION_INVALIDE,
  DISTANCE_NEGATIVE/ABERRANTE/NON_NUMERIQUE, ROTATION_INSTABLE, CALCUL_NON_INTERPRETABLE,
  plus les codes du validateur catalogue AXE_HORS_PLAGE/PRODUIT_SANS_REGLE_EXPLOITABLE/CATALOGUE_INVALIDE)
  sauf un cas non couvert par le noyau (cylindre nul avec axe renseigne, que normalizePrescription
  ignore en silence) : ce cas est intercepte cote UI par un code local AXE_INCOHERENT_CYLINDRE_NUL
  avant tout appel au noyau, a documenter si un futur ticket touche a nouveau ce fichier.'
