  acceptance_criteria:
  - la page charge le noyau par des balises script de même origine et ne contient
    aucune formule optique
  - les trois blocs sont présents, le bloc surréfraction est facultatif et le bloc
    fabrication utilisable seul
  - les quatre niveaux de valeur coexistent à l'écran, aucune étape n'en remplace
    une autre
  - la couche Détails du calcul restitue l'enchaînement produit par le noyau, pour
    la conversion, la surréfraction et le score
  - les dix cas d'erreur du contrat sont traités et affichés, aucune valeur douteuse
    n'est produite en silence
  - le vocabulaire interdit n'apparaît nulle part et le vocabulaire imposé est employé
  - la responsabilité de l'outil est énoncée dans l'interface
  - le bandeau signalant des données de démonstration fictives est présent dans le
    bloc fabrication
  - CSP identique à celle des outils existants, mention de mesure de fréquentation
    et script GoatCounter présents
  - lien retour vers ../../, bouton flottant iOS et détection is-ios présents, aucune
    couche ouverte donc aucun gestionnaire Couches
  - responsive réel en dessous de 640 px, la saisie du bloc surréfraction se réagence
    au lieu de rétrécir
  - aucune écriture localStorage ni sessionStorage, aucun appel réseau portant une
    saisie
  - aucun em-dash dans un texte visible, interface entièrement en français
