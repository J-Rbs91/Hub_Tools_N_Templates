  behavior:
  - 'outils/lentilles-souples/noyau/moteurs.js expose LentillesMoteurs (module.exports
    Node + globalThis navigateur, meme enveloppe double-export que prescription.js)
    : compenserVertexSpherique/decompenserVertexSpherique(puissanceD, distanceMm,
    parametre), compenserVertexSpheroCylindrique/decompenserVertexSpheroCylindrique(rx,
