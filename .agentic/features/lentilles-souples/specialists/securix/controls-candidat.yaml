- control_id: CTRL-PY-VULN-ADVISORY
  kind: RULE_CONTROL
  declared_confidence: MEDIUM
  source: /home/user/securix/controls/registry.yaml
  command: /usr/local/bin/python3 /home/user/securix/controls/static/scan_dependency_advisories.py
