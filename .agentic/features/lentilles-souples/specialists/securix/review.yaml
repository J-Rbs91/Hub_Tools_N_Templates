- rule_id: SEC-INJ-007
  status: PASS
  reason: Le seul contenu persiste puis reaffiche est le profil du magasin en localStorage. Il est relu
    derriere un try/catch, filtre par liste blanche de champs, puis echappe avant tout rendu HTML.
  evidence:
  - type: CODE
    detail: 'Inventaire des cles localStorage : profil du magasin, reglages d outils, historique de comptage
      de caisse, formes personnalisees, marqueurs d intro. Aucune ne contient de donnee patient. Le profil
      est relu derriere un try/catch et filtre par liste blanche de champs (sanitizeProfil).'
    result: OBSERVED
    path: outils/cloture-caisse/index.html
    covers:
    - EVR-0c93f8ee
  - type: MANUAL_REVIEW
    detail: 'Audit des 22 affectations innerHTML du depot, une par une : epaisseur-verres 1518/1532/1545/1806/1808/1870/1895/1900/2458/2470/2478/3134/3366/3378,
      campagne-email 1447/1560, demande-ordonnance 862, scanner 480/514/543/557, tests/securite 224. Toute
      valeur controlee par l utilisateur passe par esc() avant d entrer dans la chaine HTML ; le reste
      est numerique (fmt, toFixed), litteral statique (PM_LEAD, listes de cases a cocher) ou geometrie
      SVG generee. shapePath n emet que des nombres via toFixed(1), donc aucune sortie d attribut.'
    result: OBSERVED
    command: grep -rn 'innerHTML' --include=*.html . (22 occurrences, examinees une a une)
    covers:
    - EVR-0c93f8ee
  - type: RUNTIME
    detail: 'Test adverse de XSS stocke et DOM. Le profil magasin partage recoit quatre charges utiles
      (img onerror, svg onload, href javascript:, balise script) puis les cinq pages qui le relisent sont
      visitees ; ensuite les 53 champs de l outil demande et ordonnance, dont le nom et la date de naissance
      du patient, recoivent la meme charge. Resultat sur les six passes : compteur d execution a 0, aucun
      element ne naissant de la charge (img[src=x], svg[onload], [onerror], script injecte, href javascript:),
      aucune violation de CSP, aucune erreur de page, et la charge visible en texte litteral, ce qui prouve
      l echappement plutot qu une suppression silencieuse.'
    command: node xss-negatif.mjs (Chromium 1194, arbre du commit audite servi en local)
    result: PASS
    covers:
    - EVR-134cb2fc
  exception_ref: null
  evidence_contract:
  - EVR-0c93f8ee
  - EVR-134cb2fc
  rule_digest: RD-a7d57b6d31b5
