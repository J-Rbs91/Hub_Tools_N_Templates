schema_version: 1
project: Hub_Tools_N_Templates
ruleset_version: 0.1.0
review:
  type: CHANGE_REVIEW
  profile_path: project-security-profile.yaml
  reviewer: agent Arcline (mission lentilles-souples)
  commit_sha: f1367935f09f4edf893a83395d03b56aa5780e60
  profile_digest: PD-9ccd8313ea3f
  generated_at: null
  notes: 'Revue d assurance du depot entier, conduite par l agent Arcline a la demande explicite du mainteneur.
    Chaque regle applicable recoit un verdict. Un PASS repose sur une preuve relisible ou reexecutable
    ; ce qui n a pas pu etre etabli reste NOT_VERIFIED avec sa raison, et un defaut reel est marque FAIL
    plutot qu attenue. Les preuves de type RUNTIME sont cinq campagnes jouees par le reviseur dans Chromium
    sur l arbre du commit audite : test adverse de XSS, mesure d exfiltration au canari, application effective
    de la CSP, encadrement, et injection de panne sur la dependance externe. Ces scripts ne sont pas dans
    le depot et ne se rejouent donc pas en integration continue ; c est precisement le manque que consigne
    SEC-DEV-002.'
findings:
- rule_id: SEC-SEC-001
  status: PASS
  reason: 'Aucun secret n est livre au client : le site n a ni backend ni identifiant a presenter, donc
    aucune valeur reutilisable a proteger. Le controle de motifs de secrets ne detecte rien et gitleaks
    tourne sur l historique complet a chaque push et chaque PR.'
  evidence:
  - type: CODE
    detail: Le depot ne contient aucun code serveur. Le site est un ensemble de fichiers statiques publies
      par GitHub Pages ; .github/workflows/deploy.yml ne fait que televerser l arborescence, sans build
      ni runtime applicatif.
    result: OBSERVED
    path: .github/workflows/deploy.yml
    covers:
    - EVR-7950b4f3
  - type: CI
    detail: gitleaks s execute a chaque push sur main et a chaque pull request, avec fetch-depth 0, donc
      sur l historique complet et pas seulement sur l arbre courant.
    result: OBSERVED
    path: .github/workflows/security.yml
    covers:
    - EVR-7950b4f3
    - EVR-55c6c863
  - type: COMMAND
    detail: 'CTRL-SECRET-PATTERN renvoie NOT_DETECTED. La limitation declaree du controle est conservee
      : NOT_DETECTED n est pas une preuve d absence, il corrobore une revue et ne la remplace pas.'
    control_id: CTRL-SECRET-PATTERN
    command: python3 controls/static/detect_secret_patterns.py --root <depot>
    result: OBSERVED
    covers:
    - EVR-55c6c863
  exception_ref: null
  evidence_contract:
  - EVR-7950b4f3
  - EVR-55c6c863
  rule_digest: RD-1c7660e9f455
