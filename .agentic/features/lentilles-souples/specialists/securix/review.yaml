- rule_id: SEC-DEV-002
  status: NOT_VERIFIED
  reason: 'Des tests de chemins negatifs existent et sont serieux : le validateur de catalogue est eprouve
    sur ses douze cas d echec, et une corruption du catalogue livre fait sortir la suite en code 1. Le
    depot porte aussi une page tests/securite intitulee tests de non-regression securite. Deux limites
    la privent de la valeur attendue ici, et ce sont des constats de lecture : elle redefinit dans son
    propre script les fonctions qu elle eprouve, esc, sanitizeProfil, isValidSyncUrl et lienSur, au lieu
    d executer celles des pages, donc une regression du code livre la laisserait verte ; et aucun job
    de .github/workflows/ci.yml ne l ouvre, elle ne se joue qu a la main. Surtout, l invariant central
    du depot, aucune donnee saisie ne quitte le navigateur, n est couvert par aucun test du depot. Je
    l ai bel et bien eprouve pendant cette revue, au canari et a l instrumentation des cinq API sortantes,
    et il tient ; mais ce sont mes scripts, joues une fois sur ce commit, hors du depot et hors de la
    CI. Un fait acquis une fois ne se rejoue pas tout seul, et c est exactement ce que cette regle demande.
    Severite haute, donc bloquante, et c est le constat le plus utile de cette revue : un test qui echouerait
    a la premiere apparition de fetch, XMLHttpRequest, WebSocket, sendBeacon ou d une ecriture de stockage
    hors liste blanche serait peu couteux, tiendrait dans le meme moule que tests/navigation-retour.test.mjs
    deja cable en CI, et protegerait exactement ce que SECURITY.md promet au magasin.'
