options_considered:
- constantes dans index.html, comme les gabarits SHAPES d'epaisseur-verres
- fichiers .json charges par fetch
- fichier de donnees JavaScript a double export
chosen: Le catalogue fabricant est un fichier de donnees JavaScript versionne dans
  le dossier de l'outil (donnees/catalogue-demo.js), au meme format de chargement
  que le noyau.
rationale:
- Les gabarits d'epaisseur-verres tiennent en ligne parce qu'ils sont figes ; un catalogue
  fabricant est destine a croitre produit par produit et a etre reverifie regle par
  regle contre une source datee, ce qui demande un diff lisible et un fichier dont
  l'historique porte sur la donnee seule. Le JSON donnerait le meilleur diff mais
  rouvre le probleme file:// et introduit un chemin reseau et un etat d'erreur dans
  un outil qui n'en a aucun. Un litteral JavaScript se diffe aussi bien et se charge
  exactement comme le noyau.
evidence:
- 'outils/epaisseur-verres/index.html : SHAPES en dur, donnee figee, aucun test'
- 'SECURITY.md : le compteur de visites est la seule ressource externe autorisee'
reversibility: easy
requires_user_approval: false
