schema_version: 1
id: DEC-0007
mission: lentilles-souples
phase: design
category: implementation
statement: Le score d'une combinaison fabricant est la norme du residu dans l'espace
  des vecteurs de puissance, sqrt(dM^2 + dJ0^2 + dJ45^2), completee par un ordre de
  departage total.
status: accepted
authority:
  actor: arcline
  level: B
  delegated: true
  delegated_levels:
  - A
  - B
  - C
options_considered:
- ecart de sphere seul
- somme ponderee des ecarts de sphere, cylindre et axe
- norme du residu dans l'espace M/J0/J45
chosen: Le score d'une combinaison fabricant est la norme du residu dans l'espace
  des vecteurs de puissance, sqrt(dM^2 + dJ0^2 + dJ45^2), completee par un ordre de
  departage total.
rationale:
- 'L''ecart de sphere seul ignore l''astigmatisme residuel, que la mission interdit
  explicitement de negliger. Une somme ponderee demanderait des poids arbitraires
  a justifier. La norme du residu est la force de flou au sens de Thibos : c''est
  la grandeur physique reellement laissee non corrigee, elle s''exprime en dioptries,
  elle vaut zero pour une combinaison exacte, donc une combinaison exacte est toujours
  premiere. Le classement est rendu total par des departages explicites (ecart de
  sphere, puis de cylindre, puis d''axe, puis product_id, puis rule_id) pour que l''ordre
  soit reproductible.'
evidence:
- 'Thibos LN, Wheeler W, Horner D. Optom Vis Sci 1997;74(6):367-375, PMID 9293523
  : force de flou B = sqrt(M^2 + J0^2 + J45^2)'
reversibility: easy
requires_user_approval: false
