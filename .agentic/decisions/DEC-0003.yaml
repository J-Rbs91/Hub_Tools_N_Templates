rationale:
- 'config/integrations.yaml d''Arcline attend deja ce chemin exact (securix.profile_path).
  SECURIX echoue ferme sur une proposition non adoptee : sans profil, aucune obligation
  ne peut etre selectionnee, et ''indisponible'' serait faux puisque SECURIX_HOME
  est charge. Chacune des 97 capacites du vocabulaire canonique a ete tranchee contre
  le contenu reel du depot, avec le motif ecrit dans le fichier ; sur-declarer forcerait
  a produire des preuves pour des regles inapplicables, sous-declarer retirerait des
  regles sans finding. La revue est signee comme conduite par un agent et non par
  un humain.'
evidence:
- 'derive_profile.py : 2 capacites detectees, 94 non tranchees, derived.proposal true'
- select_rules.py refuse une proposition non adoptee (fail closed)
- 'select_rules.py sur le profil cure : 108 regles applicables (19 critical, 69 high,
