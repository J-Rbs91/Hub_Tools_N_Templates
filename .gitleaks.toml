# Retain every default detection rule. Only these deliberately public,
# browser-side declarations are exempt from generic-api-key findings.
# Any other secret in these files or elsewhere remains detectable.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Intentionally public, browser-side draft keys in two static tools"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^outils/(?:demande-ordonnance|cloture-caisse)/index\.html$''']
  regexes = ['''\b(?:var|let|const)\s+DRAFT_KEY\s*=''']

  [[rules.allowlists]]
  description = "EmailJS public key of the hub Contact form: public by design, sent by every browser"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^index\.html$''']
  regexes = ['''\b(?:var|let|const)\s+EMAILJS_PUBLIC_KEY\s*=''']
