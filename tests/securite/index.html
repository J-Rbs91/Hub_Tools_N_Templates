<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests de non-régression sécurité</title>
  <style>
    :root {
      --blue: #1F6FB2;
      --ink: #1b2733;
      --bg: #f4f7fa;
      --border: #d8e0e8;
      --green: #1f9d55;
      --red: #c0392b;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.45;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover { text-decoration: underline; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    .intro { margin: 0 0 20px; color: #51606e; }
    #summary {
      font-weight: 700;
      font-size: 1.1rem;
      padding: 12px 16px;
      border-radius: var(--radius);
      background: #fff;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    #summary.ok { border-color: var(--green); color: var(--green); }
    #summary.ko { border-color: var(--red); color: var(--red); }
    ul#results { list-style: none; padding: 0; margin: 0; }
    ul#results li {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: .95rem;
    }
    .tag {
      display: inline-block;
      min-width: 52px;
      text-align: center;
      font-weight: 700;
      border-radius: 6px;
      padding: 2px 8px;
      margin-right: 10px;
      font-size: .85rem;
    }
    .tag.pass { background: #e3f5ea; color: var(--green); }
    .tag.fail { background: #fbe4e1; color: var(--red); }
    .hidden-host { position: absolute; left: -9999px; top: -9999px; }
    @media (max-width: 640px) {
      body { padding: 16px 12px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="../../">&larr; Retour</a>
    <h1>Tests de non-régression sécurité</h1>
    <p class="intro">
      Cette page exécute en navigateur des assertions sur les correctifs de sécurité
      (VULN-001, VULN-003, VULN-005, VULN-008). Chaque test affiche PASS ou FAIL.
    </p>
    <div id="summary">Exécution des tests…</div>
    <ul id="results"></ul>
  </div>

  <!-- Conteneur isolé pour les tests de rendu DOM (hors écran). -->
  <div class="hidden-host" id="host" aria-hidden="true"></div>

  <script>
    (function () {
      var results = document.getElementById('results');
      var passed = 0;
      var total = 0;

      function assert(label, cond) {
        total += 1;
        if (cond) { passed += 1; }
        var li = document.createElement('li');
        var tag = document.createElement('span');
        tag.className = 'tag ' + (cond ? 'pass' : 'fail');
        tag.textContent = cond ? 'PASS' : 'FAIL';
        li.appendChild(tag);
        li.appendChild(document.createTextNode(label));
        results.appendChild(li);
      }

      /* ── Correctif VULN-001 : rendu identique à renderHeader (textContent + <br> DOM). ── */
      function renderMeta(target, p) {
        var metaParts = [];
        if ((p.adresse || '').trim()) { metaParts.push(p.adresse.trim()); }
        if ((p.tel || '').trim()) { metaParts.push('Tél : ' + p.tel.trim()); }
        target.textContent = '';
        metaParts.forEach(function (part, i) {
          if (i) { target.appendChild(document.createElement('br')); }
          target.appendChild(document.createTextNode(part));
        });
      }

      /* ── Correctif VULN-003 : copie exacte de syncEndpointId / isValidSyncUrl
           et de la reconstruction de l'URL JSONP (cf. jsonp dans index.html). ── */
      var SYNC_PREFIXE = 'https://script.google.com/macros/s/';
      var SYNC_SUFFIXE = '/exec';
      var SYNC_ID = /^https:\/\/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]{1,200})\/exec\/?$/;

      function syncEndpointId(u) {
        var brut = String(u == null ? '' : u).trim().split('#')[0].split('?')[0];
        var m = SYNC_ID.exec(brut);
        return m ? m[1] : '';
      }

      function isValidSyncUrl(u) {
        return syncEndpointId(u) !== '';
      }

      function srcJsonp(u) {
        return SYNC_PREFIXE + encodeURIComponent(syncEndpointId(u)) + SYNC_SUFFIXE + '?callback=cb_1';
      }

      /* ── Correctif VULN-008 : copies exactes de esc, urlOk et lienSur
           (outils/campagne-email/index.html), plus le fragment d'aperçu qui
           assemble les coordonnées du magasin dans emailHtml_. ── */
      function esc(v) {
        return String(v == null ? '' : v)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function urlOk(u) { return /^https?:\/\/[^\s]+$/i.test(String(u || '').trim()); }

      function lienSur(u) {
        var t = String(u == null ? '' : u).trim();
        return urlOk(t) ? t : '';
      }

      function blocCoordonnees(m) {
        var coord = [m.adresse, m.tel ? 'Tél ' + m.tel : '', m.mail]
          .filter(Boolean).map(esc).join(' &#183; ');
        return '<span style="font-weight:bold;">' + esc(m.nom) + '</span>'
          + (coord ? '<br><span>' + coord + '</span>' : '');
      }

      /* ── Correctif VULN-005 : copie exacte de sanitizeProfil. ── */
      function sanitizeProfil(p) {
        if (!p || typeof p !== 'object') { return {}; }
        function s(v) { return typeof v === 'string' ? v : (v == null ? '' : String(v)); }
        return { nom: s(p.nom), adresse: s(p.adresse), tel: s(p.tel), mail: s(p.mail) };
      }

      /* ════════ (a) VULN-001 / 005 : pas d'exécution de script au rendu ════════ */
      var host = document.getElementById('host');
      var payload = '<img src=x onerror="window.__xss=1">';
      renderMeta(host, { adresse: payload, tel: '04.00.00.00.00' });

      assert('VULN-001 — aucun script exécuté (window.__xss reste undefined)',
        typeof window.__xss === 'undefined');
      assert('VULN-001 — aucun élément <img> créé dans le conteneur',
        host.getElementsByTagName('img').length === 0);
      assert('VULN-001 — la charge est affichée comme texte littéral',
        host.textContent.indexOf(payload) !== -1);

      /* ════════ (b) VULN-003 : validation de l'URL de synchronisation ════════ */
      assert("VULN-003 — '…/AKfycbABC123/exec' accepté",
        isValidSyncUrl('https://script.google.com/macros/s/AKfycbABC123/exec') === true);
      assert("VULN-003 — '…/exec?x=1' accepté",
        isValidSyncUrl('https://script.google.com/macros/s/AKfycbABC123/exec?x=1') === true);
      assert("VULN-003 — 'http://…/exec' rejeté",
        isValidSyncUrl('http://script.google.com/macros/s/x/exec') === false);
      assert("VULN-003 — hôte étranger rejeté",
        isValidSyncUrl('https://evil.example/macros/s/x/exec') === false);
      assert("VULN-003 — 'javascript:alert(1)' rejeté",
        isValidSyncUrl('javascript:alert(1)') === false);
      assert("VULN-003 — chaîne vide rejetée",
        isValidSyncUrl('') === false);
      assert("VULN-003 — identifiant à caractères encodés ('…/x%2F..%2Fevil/exec') rejeté",
        isValidSyncUrl('https://script.google.com/macros/s/x%2F..%2Fevil/exec') === false);
      assert("VULN-003 — guillemet injecté dans l'URL rejeté",
        isValidSyncUrl('https://script.google.com/macros/s/a/exec\" onload=\"alert(1)') === false);
      assert("VULN-003 — l'URL chargée est reconstruite à partir de littéraux",
        srcJsonp('https://script.google.com/macros/s/AKfycbABC123/exec?x=1')
          === 'https://script.google.com/macros/s/AKfycbABC123/exec?callback=cb_1');
      assert("VULN-003 — la reconstruction garde l'hôte et le chemin officiels",
        srcJsonp('https://script.google.com/macros/s/AKfycb-A_b9/exec')
          .indexOf('https://script.google.com/macros/s/') === 0);

      /* ════════ (c) VULN-005 : assainissement du profil importé ════════ */
      var clean = sanitizeProfil({ nom: 'A', adresse: 123, tel: null, mail: undefined, evil: 'x' });
      var keys = Object.keys(clean).sort().join(',');

      assert('VULN-005 — clés exactement nom/adresse/tel/mail (pas de clé « evil »)',
        keys === 'adresse,mail,nom,tel');
      assert('VULN-005 — toutes les valeurs sont des chaînes',
        typeof clean.nom === 'string' && typeof clean.adresse === 'string' &&
        typeof clean.tel === 'string' && typeof clean.mail === 'string');
      assert("VULN-005 — coercition correcte (adresse '123', tel '', mail '', nom 'A')",
        clean.nom === 'A' && clean.adresse === '123' && clean.tel === '' && clean.mail === '');

      /* ════════ (d) VULN-008 : aperçu de la campagne e-mail ════════ */
      var charge2 = '<img src=x onerror="window.__xss2=1">';
      var hote2 = document.createElement('div');
      host.appendChild(hote2);
      hote2.innerHTML = blocCoordonnees({
        nom: 'Magasin', adresse: charge2,
        tel: '04.00.00.00.00', mail: 'contact@exemple.fr'
      });

      assert('VULN-008 — coordonnées du magasin : aucun script exécuté',
        typeof window.__xss2 === 'undefined');
      assert('VULN-008 — coordonnées du magasin : aucun élément <img> créé',
        hote2.getElementsByTagName('img').length === 0);
      assert('VULN-008 — coordonnées du magasin : la charge est affichée comme texte littéral',
        hote2.textContent.indexOf(charge2) !== -1);
      assert('VULN-008 — coordonnées du magasin : le séparateur reste du balisage',
        hote2.textContent.indexOf('\u00b7') !== -1);

      assert("VULN-008 — lien du bouton : 'javascript:alert(1)' rejeté",
        lienSur('javascript:alert(1)') === '');
      assert("VULN-008 — lien du bouton : 'data:text/html,<svg onload=alert(1)>' rejeté",
        lienSur('data:text/html,<svg onload=alert(1)>') === '');
      assert('VULN-008 — lien du bouton : saisie sans schéma rejetée',
        lienSur('www.exemple.fr') === '');
      assert("VULN-008 — lien du bouton : 'https://exemple.fr/rdv' accepté",
        lienSur('https://exemple.fr/rdv') === 'https://exemple.fr/rdv');

      /* ── Récapitulatif ── */
      var summary = document.getElementById('summary');
      summary.textContent = passed + '/' + total + ' tests réussis';
      summary.className = (passed === total) ? 'ok' : 'ko';
    })();
  </script>
</body>
</html>
